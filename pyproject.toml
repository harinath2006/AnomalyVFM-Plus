[project]
name = "anomalyvfm-plus"
version = "1.0.0"
description = "Extended zero-shot visual anomaly detection using vision foundation models"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi",
    "python-multipart",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.18.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "scikit-learn==1.9.1",
    "PyYAML==6.0.3",
    "safetensors==0.8.0",
    "huggingface_hub==1.33.0",
    "tokenizers==0.23.2",
    "tqdm==4.70.1",
    "regex==2026.9.29",
    "requests",
    "matplotlib"
]

[tool.vercel]
entrypoint = "api.predict:app"