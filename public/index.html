<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnomalyVFM+</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
            min-height: 100vh;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #bbb;
        }

        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .upload-area {
            border: 2px dashed #bbb;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #111;
            background: #fafafa;
        }

        .upload-area h2 {
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #666;
        }

        input[type="file"] {
            display: none;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 350px;
            margin: 25px auto 0;
            border-radius: 12px;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        #result {
            display: none;
            margin-top: 35px;
        }

        .prediction {
            text-align: center;
            padding: 25px;
            border-radius: 12px;
            background: #f2f2f2;
        }

        .prediction h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 18px;
            color: #555;
        }

        .details {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-box {
            padding: 18px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 6px;
        }

        .visuals {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .visual-box h3 {
            margin-bottom: 10px;
        }

        .visual-box img {
            width: 100%;
            border-radius: 12px;
        }

        .reason {
            margin-top: 20px;
            padding: 18px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .details,
            .visuals {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>AnomalyVFM+</h1>
    <p>Zero-Shot Visual Anomaly Detection using Vision Foundation Models</p>
</header>

<main>

    <div class="card">

        <label class="upload-area" for="imageInput">
            <h2>Upload an Image</h2>
            <p>Click here to select an image for anomaly detection</p>
        </label>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

        <img id="preview" alt="Image preview">

        <button id="predictButton" disabled>
            Detect Anomaly
        </button>

        <div id="loading">
            Running AnomalyVFM+ inference...
        </div>

        <div id="result">

            <div class="prediction">
                <h2 id="predictionText">---</h2>

                <div class="score">
                    Anomaly Score:
                    <strong id="scoreText">---</strong>
                </div>
            </div>

            <div class="details">

                <div class="detail-box">
                    <strong>Decision Threshold</strong>
                    <span id="thresholdText">---</span>
                </div>

                <div class="detail-box">
                    <strong>Model</strong>
                    <span>DINOv2 + LoRA + Multi-scale Fusion</span>
                </div>

            </div>

            <div class="reason">
                <strong>Analysis</strong>
                <p id="reasonText">---</p>
            </div>

            <div class="visuals">

                <div class="visual-box">
                    <h3>Original / Heatmap</h3>
                    <img id="heatmapImage" alt="Anomaly heatmap">
                </div>

                <div class="visual-box">
                    <h3>Anomaly Overlay</h3>
                    <img id="overlayImage" alt="Anomaly overlay">
                </div>

            </div>

        </div>

    </div>

</main>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const predictButton = document.getElementById("predictButton");
const loading = document.getElementById("loading");
const result = document.getElementById("result");

let selectedFile = null;

imageInput.addEventListener("change", () => {

    selectedFile = imageInput.files[0];

    if (!selectedFile) {
        predictButton.disabled = true;
        return;
    }

    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = "block";

    predictButton.disabled = false;

    result.style.display = "none";
});


predictButton.addEventListener("click", async () => {

    if (!selectedFile) {
        return;
    }

    predictButton.disabled = true;
    loading.style.display = "block";
    result.style.display = "none";

    const formData = new FormData();

    formData.append("file", selectedFile);

    try {

        const response = await fetch("/api/predict", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Prediction request failed.");
        }

        const data = await response.json();

        document.getElementById("predictionText").textContent =
            data.prediction;

        document.getElementById("scoreText").textContent =
            Number(data.anomaly_score).toFixed(6);

        document.getElementById("thresholdText").textContent =
            Number(data.threshold).toFixed(6);

        document.getElementById("reasonText").textContent =
            data.reason;

        document.getElementById("heatmapImage").src =
            "data:image/png;base64," + data.heatmap;

        document.getElementById("overlayImage").src =
            "data:image/png;base64," + data.overlay;

        result.style.display = "block";

    } catch (error) {

        alert(
            "Prediction failed. Please check whether the API is running."
        );

        console.error(error);

    } finally {

        loading.style.display = "none";
        predictButton.disabled = false;

    }

});

</script>

</body>
</html>
